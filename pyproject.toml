[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-sentinel"
version = "0.1.0"
description = "A reusable, agent-assisted PR reviewer: deterministic guarantees plus judgment, with a hard boundary between them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SOAR Charter Academy" }]
keywords = ["code-review", "security", "semgrep", "github-actions", "supabase"]

# Deliberately thin. PyYAML is the only hard runtime dependency; semgrep is a
# CLI shell-out (see docs/DESIGN.md s5) and is discovered at runtime rather
# than imported, so the engine degrades cleanly when it is absent.
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# The deterministic backend. Installed in CI; optional locally.
semgrep = ["semgrep>=1.60.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
sentinel = "pr_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/soar-charter-academy/pr-sentinel"
Design = "https://github.com/soar-charter-academy/pr-sentinel/blob/main/docs/DESIGN.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pr_sentinel" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S603", "S607"]  # subprocess use is the point of the Tier 0/1 runners

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
