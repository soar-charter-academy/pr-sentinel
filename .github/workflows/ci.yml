# The engine's own tests and lint.
#
# Separate from self-review.yml on purpose: this answers "is the code correct?"
# and needs no write permission at all, while self-review answers "what does
# the reviewer think of this change?" and needs three scopes. Keeping them
# apart means the job that runs the test suite - the one most likely to execute
# something a PR author wrote - holds nothing worth stealing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only, workflow-wide. Nothing here publishes anything.
permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10"; the matrix is the
        # thing that makes that claim true rather than aspirational.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # semgrep is a shell-out, not an import (DESIGN s5). Installed on one leg
      # only: the tests that need it should skip cleanly without it, and a leg
      # without semgrep is the cheapest proof that they do.
      - name: Install semgrep
        if: matrix.python-version == '3.12'
        run: python -m pip install "semgrep>=1.60.0"

      - name: Test
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

  pinned-actions:
    name: actions pinned to a SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # This repo ships a rule that flags mutable action refs in other
      # people's workflows. Enforcing it here is what makes shipping it
      # defensible.
      - name: Check own workflows
        run: python scripts/pin-actions.py --check
